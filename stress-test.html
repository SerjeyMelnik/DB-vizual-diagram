<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema Parser Stress Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 20px;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        color: #4ec9b0;
        margin-bottom: 20px;
        border-bottom: 2px solid #4ec9b0;
        padding-bottom: 10px;
      }

      .controls {
        background: #252526;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #3e3e42;
      }

      button {
        background: #0e639c;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.3s;
      }

      button:hover {
        background: #1177bb;
      }

      button:disabled {
        background: #3e3e42;
        cursor: not-allowed;
      }

      #output {
        background: #1e1e1e;
        border: 1px solid #3e3e42;
        border-radius: 8px;
        padding: 20px;
        min-height: 400px;
        max-height: 800px;
        overflow-y: auto;
        white-space: pre-wrap;
        font-size: 14px;
      }

      .status {
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 4px;
        background: #252526;
      }

      .status.running {
        border-left: 4px solid #4ec9b0;
      }

      .status.complete {
        border-left: 4px solid #6a9955;
      }

      .status.error {
        border-left: 4px solid #f48771;
      }

      .metric {
        color: #4fc1ff;
      }

      .improvement {
        color: #6a9955;
        font-weight: bold;
      }

      .warning {
        color: #ce9178;
      }

      pre {
        margin: 0;
      }

      .loading {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #4ec9b0;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Schema Parser Extreme Stress Test</h1>

      <div class="controls">
        <button id="runTests" onclick="runTests()">Run Stress Tests (Up to 7500 Tables)</button>
        <p style="margin-top: 10px; color: #858585">
          This will test the parser with 100, 500, 1000, 2500, 5000, and 7500 tables.
        </p>
      </div>

      <div id="output"></div>
    </div>

    <script type="module">
      import { runBrowserStressTests } from './src/utils/browserStressTest.ts';

      window.runTests = async function () {
        const button = document.getElementById('runTests');
        const output = document.getElementById('output');

        button.disabled = true;
        output.innerHTML = '';

        // Redirect console.log to output div
        const originalLog = console.log;
        console.log = function (...args) {
          originalLog.apply(console, args);
          const message = args.join(' ');
          output.innerHTML += message + '\n';
          output.scrollTop = output.scrollHeight;
        };

        try {
          const status = document.createElement('div');
          status.className = 'status running';
          status.innerHTML = '<span class="loading"></span>Running stress tests...';
          output.appendChild(status);

          await runBrowserStressTests();

          status.className = 'status complete';
          status.innerHTML = '✓ Tests completed successfully!';
        } catch (error) {
          const status = document.createElement('div');
          status.className = 'status error';
          status.innerHTML = '✗ Error: ' + error.message;
          output.appendChild(status);
          console.error(error);
        } finally {
          console.log = originalLog;
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
